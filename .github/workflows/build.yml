name: Build and test (macOS)

# Every push and pull request: lint and unit tests on macOS, then the app is built for Apple silicon and for
# Intel Macs, checked with its built-in self-test (render, VideoToolbox or x264, Whisper captions, titles,
# bleeping) and started once. When main carries a version (src/version.py) with no release yet, the build
# publishes one: tag vX.Y.Z with a DMG and a zip per chip (the zip is what the in-app updater downloads),
# and that version's notes from CHANGELOG.md. Pushing a vX.Y.Z tag does the same.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "claude/**"]      # claude/** branches build and test; only main publishes
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/images/**"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Lint
        run: |
          python -m pip install ruff==0.17.2
          python -m ruff check src tests scripts

      - name: Install packages
        run: python -m pip install -U pip && python -m pip install -r requirements.txt pywebview

      # the same tools the app ships and downloads (Homebrew's FFmpeg has no libass, so no 'subtitles' filter:
      # captions can't be drawn with it). This also checks the Mac download sources still work
      - name: Get the tools the way the app does
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python src/tools_setup.py --dest tools ffmpeg twitchdownloader ytdlp
          tools/ffmpeg -hide_banner -filters | grep -q " subtitles " || { echo "::error title=ffmpeg::no subtitles filter"; exit 1; }
          echo "$PWD/tools" >> "$GITHUB_PATH"

      - name: Unit tests
        env:
          CLIPRADAR_NO_SOUND: "1"
        run: |
          set -e
          for t in safety signals persist checkflow editing detect reactions titles exports live framing sources \
                   locations rename versions release_assets startup memory deepscan retry chattitles ranking_explain \
                   hashtags ytextra download cleanup quality campaigns captions_anim api_contract file_serving \
                   errorlog spelling filelocks child_cleanup; do
            echo "::group::test_$t"
            python "tests/test_$t.py"
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the React UI
        working-directory: web
        run: npm ci && npm run build

      - name: Install Playwright
        run: python -m pip install playwright && python -m playwright install chromium

      - name: Browser and media tests
        env:
          CLIPRADAR_NO_SOUND: "1"
          CLIPRADAR_UI: web
        run: |
          set -e
          for t in ui web_a11y web_exports web_home web_live_moments web_review web_settings studio_auto studio_handoff \
                   media_matrix render_lifecycle gpu preview_fallback; do
            echo "::group::test_$t"
            python "tests/test_$t.py"
            echo "::endgroup::"
          done

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15            # Apple silicon
            arch: arm64
          - runner: macos-15-intel      # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      SIGNING_CONFIGURED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the runner's chip
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: React UI tests
        working-directory: web
        run: npm ci && npm test

      # Developer ID signing and notarization, only once the certificate is in the repo's secrets
      # (README: Signing). Without them the app is signed ad hoc.
      - name: Set up code signing
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$ID" ]; then echo "::error title=signing::no Developer ID Application identity in the certificate"; exit 1; fi
          echo "CODESIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials clipradar --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" --keychain "$KC"
            echo "NOTARY_PROFILE=clipradar" >> "$GITHUB_ENV"
          fi

      - name: Build Clip Radar.app, the DMG and the zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv
          scripts/build_app.sh
          for t in ffmpeg ffprobe yt-dlp TwitchDownloaderCLI; do
            test -x "dist/Clip Radar.app/Contents/MacOS/tools/$t" || { echo "::error title=tools::$t missing from the app"; exit 1; }
          done
          file "dist/Clip Radar.app/Contents/MacOS/ClipRadar" "dist/Clip Radar.app/Contents/MacOS/tools/ffmpeg"
          du -sh "dist/Clip Radar.app" dist/*.dmg dist/*.zip

      - name: Make a test stream (video + spoken words)
        run: |
          T="$RUNNER_TEMP"; FF="tools/ffmpeg"
          say -r 160 -o "$T/speech.aiff" "No way, he just did that. Chat, clip it right now. That was absolutely insane." || true
          if [ -f "$T/speech.aiff" ]; then
            "$FF" -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=60" \
              -f lavfi -i "anoisesrc=color=pink:amplitude=0.01:duration=60" -i "$T/speech.aiff" \
              -filter_complex "[2:a]aresample=48000,adelay=30000|30000,volume=3[s];[1:a]aresample=48000[n];[n][s]amix=inputs=2:normalize=0[a]" \
              -map 0:v -map "[a]" -t 60 -c:v libx264 -preset ultrafast -c:a aac "$T/test.mp4"
          else
            echo "::warning title=speech::say couldn't make test speech"
            "$FF" -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=60" -f lavfi -i "sine=frequency=300:duration=60" \
              -t 60 -c:v libx264 -preset ultrafast -c:a aac "$T/test.mp4"
          fi
          ls -la "$T/test.mp4"

      - name: Self-test inside the app
        run: |
          T="$RUNNER_TEMP"
          export CLIPRADAR_WORK="$T/vc-work" CLIPRADAR_NO_SOUND=1
          "dist/Clip Radar.app/Contents/MacOS/ClipRadar" --selftest "$T/selftest.json" "$T/test.mp4" &
          PID=$!
          ( sleep 900; kill -9 $PID 2>/dev/null ) & WD=$!
          wait $PID || true
          kill $WD 2>/dev/null || true
          tail -n 60 "$HOME/Library/Application Support/ClipRadar/clipradar.log" || true
          test -f "$T/selftest.json" || { echo "::error title=selftest::no report written"; exit 1; }
          python - "$T/selftest.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          ok = [c["name"] for c in r["checks"] if c["ok"]]
          print(f"::notice title=Passed ({len(ok)} of {len(r['checks'])})::{', '.join(ok)}")
          for c in r["checks"]:
              d = c["detail"].replace("\n", " | ")
              if not c["ok"]:
                  print(f"::error title=FAIL {c['name']}::{d}")
              elif any(k in c["name"] for k in ("captions", "title", "render", "encoder", "tool", "laughter")):
                  print(f"::notice title={c['name']}::{d}")
          sys.exit(0 if r["ok"] else 1)
          PY

      - name: Smoke test (the app's server starts and answers)
        run: |
          export CLIPRADAR_WORK="$RUNNER_TEMP/vc-work" CLIPRADAR_NO_SOUND=1
          "dist/Clip Radar.app/Contents/MacOS/ClipRadar" --browser &
          PID=$!
          ok=""
          for i in $(seq 1 90); do
            sleep 1
            if curl -fsS --max-time 5 http://127.0.0.1:7860/api/status | python -c "import json,sys; v=json.load(sys.stdin)['version']; print('version', v)"; then ok=1; break; fi
          done
          kill $PID 2>/dev/null || true
          test -n "$ok" || { tail -n 80 "$HOME/Library/Application Support/ClipRadar/clipradar.log"; echo "::error title=smoke::no answer from the app"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ClipRadar-macOS-${{ matrix.arch }}
          path: |
            dist/ClipRadar-macOS-${{ matrix.arch }}.dmg
            dist/ClipRadar-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release (when this version has none yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/version.py)"
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag exists already"; exit 0; fi
          # this version's section of CHANGELOG.md
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error title=Changelog::no section for $ver in CHANGELOG.md"; exit 1; fi
          printf '\n---\n**Download:** `ClipRadar-macOS-arm64.dmg` for Apple silicon (M1 and later) or `ClipRadar-macOS-x86_64.dmg` for Intel Macs. macOS 11 or later.\n' >> notes.md
          ls -la dist
          gh release create "$tag" dist/*.dmg dist/*.zip --title "Clip Radar $ver for macOS" --notes-file notes.md \
            --target "${{ github.sha }}" --latest
